seed: 42

physics:
  nu: 0.002
  time_window: 1.0
  nr_time_windows: 10

model:
  hidden_dim: 256
  num_layers: 4

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.999

training:
  max_steps_per_window: 2000
  log_every: 200

batch_size:
  initial_condition: 1024
  interior: 1024

loss:
  initial_condition: 1.0
  interior: 1.0

causal:
  n_chunks: 8
