seed: 42

physics:
  E: 10.0
  nu: 0.2

model:
  hidden_dim: 128
  num_layers: 4

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.999

training:
  max_steps: 1000000
  log_every: 1000

batch_size:
  top: 256
  bottom: 512
  interior: 8192

loss:
  top: 10.0
  bottom: 10.0
  interior: 1.0