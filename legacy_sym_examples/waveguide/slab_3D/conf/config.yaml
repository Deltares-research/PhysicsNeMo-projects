seed: 42

domain:
  width: 1.0
  length: 1.0
  height: 1.0

physics:
  wave_number: 16.0
  len_slab: 0.2
  eps0: 1.0
  eps1: 1.5
  port_amplitude: 1.0

model:
  hidden_dim: 160
  num_layers: 4

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.999

training:
  max_steps: 200000
  log_every: 500

batch_size:
  PEC: 400
  Waveguide_port: 300
  ABC: 100
  Interior: 1000

loss:
  pec: 1.0
  port: 1.0
  abc: 1.0
  interior: 1.0
