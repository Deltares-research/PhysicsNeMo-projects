seed: 42

model:
  hidden_dim: 128
  num_layers: 4

physics:
  Re: 590
  y_plus: 30
  p_grad: 1.0

optimizer:
  lr: 1e-4

scheduler:
  decay_rate: 0.999

training:
  max_steps: 400000
  log_every: 1000

batch_size:
  wf_pt: 512
  interior: 2048
  inlet: 256
  outlet: 256
  interior_init: 2048

loss:
  wf_pt: 1.0
  interior: 1.0
  inlet: 1.0
  outlet: 1.0
  interior_init: 1.0

