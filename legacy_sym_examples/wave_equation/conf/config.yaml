seed: 42

model:
  num_layers: 6
  layer_size: 256

optimizer:
  lr: 3.0e-4

scheduler:
  decay_rate: 0.9995

loss_weights:
  ic: 1.0
  bc: 1.0
  pde: 1.0

training:
  max_steps: 10000
  log_every: 500

batch_size:
  IC: 315
  BC: 200
  interior: 3150