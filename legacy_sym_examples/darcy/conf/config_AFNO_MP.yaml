seed: 42

model:
  in_channels: 1
  out_channels: 1
  patch_size: 16
  embed_dim: 256
  depth: 4
  num_blocks: 8

data:
  dataset_name: Darcy_241
  dataset_dir: datasets
  auto_download: false
  n_train: 1000
  n_test: 100

optimizer:
  lr: 3.0e-4

scheduler:
  decay_rate: 0.999

training:
  max_steps: 10000
  log_every: 500

batch_size:
  train: 32
  validation: 32
