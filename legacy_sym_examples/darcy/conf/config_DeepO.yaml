seed: 42

model:
  num_layers: 4
  layer_size: 256

data:
  dataset_name: Darcy_241
  dataset_dir: datasets
  auto_download: false
  n_train: 1000
  n_test: 10

optimizer:
  lr: 3.0e-4

scheduler:
  decay_rate: 0.9995

training:
  max_steps: 100000
  log_every: 1000

batch_size:
  train: 1000
  validation: 2000
