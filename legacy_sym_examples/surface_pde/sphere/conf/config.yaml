seed: 42

model:
  hidden_dim: 128
  num_layers: 4

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.9995

training:
  max_steps: 50000
  log_every: 500

batch_size:
  surface: 1024
  validation: 2048

loss:
  surface_poisson: 1.0
  surface_flux: 1.0
  point: 1.0
