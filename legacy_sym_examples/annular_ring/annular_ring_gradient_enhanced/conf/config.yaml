seed: 42

model:
  hidden_dim: 128
  num_layers: 4

physics:
  nu: 0.01
  inlet_vel: 1.5

geometry:
  x_min: -6.732
  x_max: 6.732
  y_min: -2.0
  y_max: 2.0
  outer_radius: 2.0
  inner_radius: 1.0

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.999

training:
  max_steps: 200000
  log_every: 1000

batch_size:
  inlet: 64
  outlet: 64
  no_slip: 1024
  interior: 2048
  integral_continuity: 256

loss:
  inlet: 1.0
  outlet: 1.0
  no_slip: 1.0
  interior: 1.0
  gradient: 0.01
  integral_continuity: 0.1
