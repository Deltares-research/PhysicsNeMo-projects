seed: 42

model:
  hidden_dim: 128
  num_layers: 4

optimizer:
  lr: 0.0001

scheduler:
  decay_rate: 0.999

training:
  max_steps: 1000000
  log_every: 1000

batch_size:
  inlet: 256
  outlet: 256
  no_slip: 8192
  lr_interior: 2048
  hr_interior: 2048
  integral_continuity: 8192
  num_integral_continuity: 8

loss:
  inlet: 1.0
  outlet: 1.0
  no_slip: 1.0
  interior: 1.0
  integral_continuity: 0.1
