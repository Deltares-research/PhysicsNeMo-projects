seed: 42

domain:
  width: 0.1
  height: 0.1

physics:
  nu: 0.01

model:
  hidden_dim: 128
  num_layers: 4

optimizer:
  lr: 1.0e-3

scheduler:
  decay_rate: 0.999

training:
  max_steps: 10000
  log_every: 500

batch_size:
  TopWall: 1000
  NoSlip: 1000
  Interior: 4000
  Interface: 1000

loss:
  top_wall: 1.0
  no_slip: 1.0
  interior: 1.0
  interface: 1.0

importance:
  pool_size: 20000

fbpinn:
  beta: 200.0
